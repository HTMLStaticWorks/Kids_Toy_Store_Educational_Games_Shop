<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
  </defs>
  <!-- Rounded Gradient Background matching navbar brand icon -->
  <rect x="0" y="0" width="64" height="64" rx="18" fill="url(#brandGrad)"/>
  <!-- Geometric Shapes (fa-shapes) -->
  <g fill="#FFFFFF">
    <!-- Circle -->
    <circle cx="24" cy="24" r="8"/>
    <!-- Triangle -->
    <polygon points="44,16 36,32 52,32"/>
    <!-- Square -->
    <rect x="24" y="38" width="16" height="16" rx="3"/>
  </g>
</svg>
