<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - WonderToys Kids Store</title>
  <meta name="description" content="Create a WonderToys account to get 15% OFF your first order, access exclusive STEM rewards, and manage wishlists.">
  <meta name="keywords" content="register toy account, sign up toy shop, parent rewards club">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  
  <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="d-flex flex-column min-vh-100 position-relative">

  <!-- Floating Corner Toggles -->
  <div class="position-absolute top-0 end-0 p-3 d-flex gap-2 z-3">
    <button class="header-action-btn theme-toggle-btn" title="Toggle Light/Dark Theme">
      <i class="fas fa-moon text-primary"></i>
    </button>
    <button class="header-action-btn rtl-toggle-btn" title="Toggle RTL/LTR Layout" onclick="toggleRTL()">RTL</button>
  </div>

  <!-- Signup Main (No Navbar Header) -->
  <main class="py-5 my-auto">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-9 col-lg-6">

          <!-- Centered Brand Logo & Name at Top -->
          <div class="text-center mb-4">
            <a class="navbar-brand d-inline-flex align-items-center gap-2 mb-2" href="index.html">
              <div class="brand-icon"><i class="fas fa-shapes"></i></div>
              <span>Wonder<span style="color:var(--secondary-color);">Toys</span></span>
            </a>
          </div>

          <!-- Glass Card Panel -->
          <div class="glass-panel p-4 p-md-5">
            
            <div class="text-center mb-4">
              <span class="badge bg-danger rounded-pill px-3 py-2 fw-bold mb-2">🎁 Get 15% OFF First Order</span>
              <h2 class="fw-bold mb-1">Create Your Account</h2>
              <p class="text-secondary small">Join thousands of parents & educators giving the gift of learning</p>
            </div>

            <form onsubmit="event.preventDefault(); showToast('🎉 Account created successfully! Check your email for 15% voucher.', 'success'); setTimeout(() => window.location.href='index.html', 1500);">
              
              <!-- Account Type Selection -->
              <div class="mb-3">
                <label class="form-label fw-bold small">I am registering as:</label>
                <div class="row g-2">
                  <div class="col-4">
                    <input type="radio" class="btn-check" name="role" id="roleParent" checked>
                    <label class="btn btn-outline-primary w-100 rounded-pill small py-2" for="roleParent"><i class="fas fa-heart me-1"></i> Parent</label>
                  </div>
                  <div class="col-4">
                    <input type="radio" class="btn-check" name="role" id="roleTeacher">
                    <label class="btn btn-outline-primary w-100 rounded-pill small py-2" for="roleTeacher"><i class="fas fa-graduation-cap me-1"></i> Teacher</label>
                  </div>
                  <div class="col-4">
                    <input type="radio" class="btn-check" name="role" id="roleShopper">
                    <label class="btn btn-outline-primary w-100 rounded-pill small py-2" for="roleShopper"><i class="fas fa-gift me-1"></i> Gift Shopper</label>
                  </div>
                </div>
              </div>

              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label class="form-label fw-bold small">First Name *</label>
                  <input type="text" class="form-control rounded-pill" placeholder="Sarah" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-bold small">Last Name *</label>
                  <input type="text" class="form-control rounded-pill" placeholder="Jenkins" required>
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label fw-bold small">Email Address *</label>
                <input type="email" class="form-control rounded-pill" placeholder="sarah@example.com" required>
              </div>

              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label class="form-label fw-bold small">Password *</label>
                  <input type="password" class="form-control rounded-pill" placeholder="••••••••" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-bold small">Confirm Password *</label>
                  <input type="password" class="form-control rounded-pill" placeholder="••••••••" required>
                </div>
              </div>

              <!-- Password Strength Bar -->
              <div class="mb-3">
                <div class="progress" style="height: 6px;">
                  <div class="progress-bar bg-success" role="progressbar" style="width: 85%" aria-valuenow="85" aria-valuemin="0" aria-valuemax="100"></div>
                </div>
                <small class="text-success fw-bold">Password Strength: Strong</small>
              </div>

              <div class="form-check mb-2">
                <input class="form-check-input" type="checkbox" id="newsletterCheck" checked>
                <label class="form-check-label small text-secondary" for="newsletterCheck">Send me birthday vouchers & early STEM kit launches</label>
              </div>

              <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="termsCheck" required>
                <label class="form-check-label small text-secondary" for="termsCheck">I agree to the <a href="#">Terms of Service</a> & <a href="#">Privacy Policy</a></label>
              </div>

              <button type="submit" class="btn btn-toy-secondary btn-lg w-100 rounded-pill mb-3">
                <i class="fas fa-user-plus me-2"></i> Create Account
              </button>

              <div class="text-center pt-3 border-top d-flex justify-content-between align-items-center">
                <a href="index.html" class="small text-secondary"><i class="fas fa-arrow-left me-1"></i> Back to Store</a>
                <div>
                  <span class="text-secondary small">Already have an account?</span>
                  <a href="login.html" class="fw-bold text-primary ms-1">Log In &rarr;</a>
                </div>
              </div>
            </form>

          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Simple Auth Footer -->
  <footer class="py-3 border-top mt-auto text-center text-muted small">
    <div class="container">&copy; 2026 WonderToys Store. All Rights Reserved.</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/theme-toggle.js"></script>
  <script src="assets/js/rtl-toggle.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
